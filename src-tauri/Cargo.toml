[package]
name = "app"
version = "0.1.0"
description = "OCR Scan Tool - barcode/QR decode + text OCR from screen region"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
xcap = "0.4"
rxing = "0.6"
arboard = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
base64 = "0.22"
chrono = "0.4"
thiserror = "2"
paddle-ocr-rs = "0.6"
ort = "=2.0.0-rc.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
