[package]
name = "app"
version = "0.1.0"
description = "Windows desktop OCR scan tool: region capture, barcode/QR decode, PaddleOCR text fallback, clipboard and local history"
authors = ["Evraldi"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
xcap = "0.4"
rxing = "0.6"
arboard = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
base64 = "0.22"
chrono = "0.4"
thiserror = "2"
# `copy-dylibs` bawaan paddle-ocr-rs/ort menyalin DLL ke folder build dan
# gagal di CI saat path-nya belum ada. ONNX Runtime di-linked statically,
# jadi cukup aktifkan download-binaries tanpa copy-dylibs.
paddle-ocr-rs = { version = "0.6", default-features = false, features = ["download-binaries"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
